[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradloop-ragsdk-omni-training"
version = "0.0.0"
description = "Remote-safe scaffold for independent training experiments"
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
